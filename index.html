<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pranet Patel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Courier New', monospace;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #f0f0f0;
      margin: 1.5rem auto;
      opacity: 0.4;
    }

    p {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pranet Patel</h1>
    <div class="divider"></div>
    <p>Coming Soon</p>
  </div>
</body>
</html>
